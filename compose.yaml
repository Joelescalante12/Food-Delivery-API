services:
  api:
    build: .
    image: food-delivery-api
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: fooddelivery
      DB_USER_M: food_delivery
      DB_PASSWORD: 1234
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: food_delivery
      MYSQL_PASSWORD: 1234
      MYSQL_DATABASE: fooddelivery
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      start_period: 20s
      retries: 5
      timeout: 10s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: