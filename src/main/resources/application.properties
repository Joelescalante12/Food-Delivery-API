spring.application.name=food-delivery-api


spring.datasource.url=jdbc:mysql://${DB_HOST}/fooddelivery
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER_M}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

mapbox.api.base-url=https://api.mapbox.com/search/geocode/v6/forward
mapbox.api.access-token=${MAPBOX_PUBLIC_TOKEN}

api.security.token.secret=${JWT_SECRET:12345678}